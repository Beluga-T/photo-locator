# Builds the container image and publishes it to GitHub Container Registry,
# so `docker run ghcr.io/beluga-t/photo-locator` works without cloning.
#
# Triggers: every release tag (v1.2.3 -> :1.2.3, :1.2, :latest), plus a manual
# run from the Actions tab for rebuilding :latest off main. Multi-arch because
# the people most likely to want a prebuilt image are on Apple Silicon or a
# Raspberry Pi-class box — exactly the machines an amd64-only image locks out.
#
# release.yml fires on the same v* tags and publishes the double-clickable
# desktop downloads. The two are independent — different credentials (this one
# needs packages:write, that one contents:write) and neither waits on the other
# — but they are the same shipment, so a tag produces both an image and a
# Release, and the two must not describe that tag differently. That is the only
# reason the :latest line below cares about prereleases.
name: docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # QEMU is what makes the arm64 half of the build possible on an
      # amd64 runner; buildx drives the multi-platform build itself.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the repository name for us — GHCR requires
      # lowercase, and github.repository is "Beluga-T/photo-locator".
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Not on a prerelease tag. release.yml marks any tag with a hyphen
            # in it (v1.2.0-rc1, -beta2) as a prerelease on the Releases page,
            # and it would contradict that to hand the same commit :latest here
            # — someone doing `docker run …:latest` is asking for the stable
            # one. A manual run off a branch still refreshes :latest, which is
            # what the workflow_dispatch trigger is for.
            type=raw,value=latest,enable=${{ github.ref_type != 'tag' || !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
